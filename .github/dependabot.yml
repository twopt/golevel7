# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://help.github.com/github/administering-a-repository/configuration-options-for-dependency-updates

version: 2
updates:
  # Maintain dependencies for Go
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      go-deps:
        patterns:
          - "*"
    cooldown:
      default-days: 7            # Waits 7 days by default for any update
      semver-major-days: 14      # Waits 14 days for major/breaking changes
      semver-minor-days: 7       # Waits 7 days for new features
      semver-patch-days: 3       # Waits 3 days for bug fixes

  # Maintain dependencies for GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions-deps:
        patterns:
          - "*"
    cooldown:
      default-days: 7            # Waits 7 days by default for any update
