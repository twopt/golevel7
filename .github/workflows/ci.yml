name: ci

on:
  push:
    branches:
      - master
      - main
  pull_request:

jobs:
  ci:
    name: Continuous Integration
    env: 
      GOPRIVATE: github.com/${{ github.repository_owner }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # WARNING:
      # - GH_TOKEN secret access must be granted to the repository
      - name: Grant access to private Go modules
        env: 
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
        if: ${{ env.GITHUB_TOKEN != '' }}
        run: |
           git config --global user.name github-actions
           git config --global url."https://github-actions:${GITHUB_TOKEN}@github.com".insteadOf "https://github.com"

      - name: Set Up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with: 
          go-version: '1.26.1'
          check-latest: true
          cache: true
          cache-dependency-path: "**/*.sum"

      - name: Test
        run: make ci

      - name: Upload coverage
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage
          path: coverage.*
